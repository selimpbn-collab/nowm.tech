<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | nowm.tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Fira Code', monospace; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .dark .glass { background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow { box-shadow: 0 0 25px -5px rgba(20, 184, 166, 0.3); }
        .dark .glow { box-shadow: 0 0 25px -5px rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">
    <div class="px-4 lg:px-8 py-6">
        <div class="max-w-7xl mx-auto">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <a href="/dashboard" class="text-sm text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-mono mb-2 inline-block">← Back to Dashboard</a>
                    <h1 class="text-3xl font-bold font-mono">Tasks</h1>
                </div>
                <button onclick="addTask()" class="px-4 py-2 rounded-xl bg-brand-500 text-white font-mono hover:bg-brand-400 transition-all">
                    <i class="fas fa-plus mr-2"></i>Add Task
                </button>
            </div>

            <div class="glass rounded-2xl p-6">
                <div class="space-y-3" id="taskList">
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50">
                        <div>
                            <p class="font-mono font-semibold">Deploy to GitHub Pages</p>
                            <p class="text-xs text-slate-500">Commit 03debe5 to remote</p>
                        </div>
                        <span class="px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-500 text-xs font-mono">DONE</span>
                    </div>
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50">
                        <div>
                            <p class="font-mono font-semibold">Fix Azure workflow</p>
                            <p class="text-xs text-slate-500">Static site deployment</p>
                        </div>
                        <span class="px-2 py-1 rounded-full bg-emerald-500/10 text-emerald-500 text-xs font-mono">DONE</span>
                    </div>
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50">
                        <div>
                            <p class="font-mono font-semibold">Monitor website status</p>
                            <p class="text-xs text-slate-500">Every 5 minutes</p>
                        </div>
                        <span class="px-2 py-1 rounded-full bg-blue-500/10 text-blue-500 text-xs font-mono">ACTIVE</span>
                    </div>
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50">
                        <div>
                            <p class="font-mono font-semibold">Configure GitHub Pages</p>
                            <p class="text-xs text-slate-500">Auto-redirect from www</p>
                        </div>
                        <span class="px-2 py-1 rounded-full bg-yellow-500/10 text-yellow-500 text-xs font-mono">PENDING</span>
                    </div>
                </div>
            </div>

            <div class="mt-6 glass rounded-2xl p-6">
                <h3 class="text-sm text-slate-500 dark:text-slate-400 font-mono mb-4">Add New Task</h3>
                <div class="flex gap-3">
                    <input type="text" id="newTask" class="flex-1 px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-mono focus:outline-none focus:border-brand-500" placeholder="Task description...">
                    <button onclick="addNewTask()" class="px-4 py-2 rounded-xl bg-brand-500 text-white font-mono hover:bg-brand-400 transition-all">
                        Add
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function addTask() {
            const input = prompt('Enter task description:');
            if (input) {
                const list = document.getElementById('taskList');
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50';
                div.innerHTML = `
                    <div class="flex-1">
                        <p class="font-mono font-semibold">${input}</p>
                        <p class="text-xs text-slate-500">Created just now</p>
                    </div>
                    <span class="px-2 py-1 rounded-full bg-yellow-500/10 text-yellow-500 text-xs font-mono">PENDING</span>
                    <button class="ml-4 text-sm text-red-500 hover:text-red-400" onclick="this.parentElement.parentElement.remove()">×</button>
                `;
                list.appendChild(div);
            }
        }

        function addNewTask() {
            const input = document.getElementById('newTask').value;
            if (input) {
                const list = document.getElementById('taskList');
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50';
                div.innerHTML = `
                    <div class="flex-1">
                        <p class="font-mono font-semibold">${input}</p>
                        <p class="text-xs text-slate-500">Created just now</p>
                    </div>
                    <span class="px-2 py-1 rounded-full bg-yellow-500/10 text-yellow-500 text-xs font-mono">PENDING</span>
                    <button class="ml-4 text-sm text-red-500 hover:text-red-400" onclick="this.parentElement.parentElement.remove()">×</button>
                `;
                list.appendChild(div);
                document.getElementById('newTask').value = '';
            }
        }
    </script>
</body>
</html>
